# Runs the Playwright e2e tests against a deployed environment.
name: E2E tests

# Title shown in the Actions list, e.g. "E2E on qa (release 4, repository_dispatch)"
run-name: E2E on ${{ github.event.inputs.env || github.event.client_payload.env || 'development' }} (release ${{ github.event.inputs.release || github.event.client_payload.release || '4' }}, ${{ github.event_name }})

on:
  # Manual run from the Actions tab: pick environment, suite and release
  workflow_dispatch:
    inputs:
      env:
        description: "Environment to test"
        type: choice
        options: [development, uat, qa, prod]
        default: development
      suite:
        description: "Which tests"
        type: choice
        options: [all, smoke, regression, api, ui]
        default: smoke
      release:
        description: "Release deployed there (1, 2, 3 or 4)"
        default: "4"
  # Called by the app repo after a deployment (repository_dispatch)
  repository_dispatch:
    types: [deployment-finished]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      TEST_ENV: ${{ github.event.inputs.env || github.event.client_payload.env || 'development' }}
      APP_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || '4' }}
      # Only needed if Vercel Deployment Protection is on (stored as a GitHub secret)
      VERCEL_BYPASS_SECRET: ${{ secrets.VERCEL_BYPASS_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Pick the test suite
        id: suite
        run: |
          case "${{ github.event.inputs.suite || github.event.client_payload.suite || 'smoke' }}" in
            smoke) echo "grep=--grep @smoke" >> "$GITHUB_OUTPUT" ;;
            regression) echo "grep=--grep @regression" >> "$GITHUB_OUTPUT" ;;
            api) echo "grep=--grep @api" >> "$GITHUB_OUTPUT" ;;
            ui) echo "grep=--grep @browser" >> "$GITHUB_OUTPUT" ;;
            *) echo "grep=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Run tests
        run: npx playwright test ${{ steps.suite.outputs.grep }}

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14
